<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mata Malam</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="brand" onclick="showHomePage()">
      <span>Mata Malam</span>
    </div>
    <nav>
      <ul>
        <li><button class="nav-btn" onclick="toggleLanguage()" id="nav-lang">Language (EN)</button></li>
        <li><a onclick="showDonePage()" id="nav-done">History</a></li>
        <li><a onclick="showReportPage()" id="nav-about">Report</a></li>
        <li><a onclick="showSettingsPage()" id="nav-settings">Settings</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Page View 1: Main Home Page (To-Do List) -->
    <div id="home-page" class="page-view">
      <section class="task-section">
        <div class="task-section-header">
          <h2 id="todo-title">To-Do List</h2>
          <span class="task-meta" id="todo-meta"></span>
        </div>
        <ul class="task-list" id="todo-list">
          <!-- Pending tasks rendered dynamically -->
        </ul>
      </section>

      <div style="text-align: center;">
        <button class="btn" id="hero-btn" onclick="handleClick()">Synchronize Data</button>
      </div>
    </div>

    <!-- Page View 2: Standalone History Page -->
    <div id="done-module-page" class="page-view module-page">
      <div style="margin-bottom: 1.5rem;" class="no-print">
        <button class="btn" onclick="showHomePage()" style="background-color: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.5rem 1rem;" id="back-home-done">
          ← Back to To-Do List
        </button>
      </div>

      <section class="task-section">
        <div class="task-section-header">
          <h2 id="done-title">History</h2>
          <span class="task-meta" id="done-meta"></span>
        </div>
        <ul class="task-list" id="done-list">
          <!-- Submitted tasks rendered dynamically -->
        </ul>
      </section>
    </div>

    <!-- Camera & Submit Sheet: live camera capture for a task, then review and submit -->
    <div id="submit-sheet" class="sheet-backdrop" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-task-label">
        <h3 id="sheet-task-label"></h3>
        <div class="camera-preview" id="sheet-photo">
          <video id="camera-video" autoplay playsinline muted></video>
          <img id="sheet-photo-img" alt="Captured Photo" hidden>
          <span id="camera-status" class="camera-status" aria-live="polite"></span>
        </div>
        <div class="coord-display" id="sheet-coord" aria-live="polite"></div>
        <div class="sheet-actions">
          <button type="button" class="btn btn-secondary" onclick="closeSubmitSheet()" id="sheet-cancel">Cancel</button>
          <button type="button" class="btn btn-secondary" onclick="openTaskCamera()" id="sheet-retake" hidden>Retake</button>
          <button type="button" class="btn" onclick="capturePhoto()" id="sheet-capture">Capture</button>
          <button type="button" class="btn" onclick="submitTask()" id="sheet-submit" hidden>Submit</button>
        </div>
      </div>
    </div>

    <!-- Page View 3: Standalone Report Page -->
    <div id="report-module-page" class="page-view module-page">
      <div style="margin-bottom: 1.5rem;" class="no-print">
        <button class="btn" onclick="showHomePage()" style="background-color: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.5rem 1rem;" id="back-home-report">
          ← Back to Home
        </button>
      </div>

      <div class="module-page-card">
        <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="color: var(--accent-color); font-size: 2rem;" id="report-title">Log Reports</h1>
            <p style="color: var(--text-muted);" id="report-desc">
              Filter submitted log entries by month, year, and location selection.
            </p>
          </div>
          <button class="btn no-print" onclick="printReport()" id="btn-print" style="padding: 0.6rem 1.25rem;">
            Print Report
          </button>
        </div>

        <div class="module-features" style="border-top: none; margin-top: 0; padding-top: 0;">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem;" class="no-print">
            <div class="module-group">
              <label for="report-month-select" class="module-label" id="label-report-month">Select Month</label>
              <select id="report-month-select" class="select-input" onchange="generateReport()">
                <option value="" id="opt-all-months">All Months</option>
                <option value="01" id="opt-m1">January</option>
                <option value="02" id="opt-m2">February</option>
                <option value="03" id="opt-m3">March</option>
                <option value="04" id="opt-m4">April</option>
                <option value="05" id="opt-m5">May</option>
                <option value="06" id="opt-m6">June</option>
                <option value="07" id="opt-m7">July</option>
                <option value="08" id="opt-m8">August</option>
                <option value="09" id="opt-m9">September</option>
                <option value="10" id="opt-m10">October</option>
                <option value="11" id="opt-m11">November</option>
                <option value="12" id="opt-m12">December</option>
              </select>
            </div>

            <div class="module-group">
              <label for="report-year-select" class="module-label" id="label-report-year">Select Year</label>
              <select id="report-year-select" class="select-input" onchange="generateReport()">
                <option value="" id="opt-all-years">All Years</option>
              </select>
            </div>

            <div class="module-group">
              <label for="report-module-select" class="module-label" id="label-report-module">Select Location</label>
              <select id="report-module-select" class="select-input" onchange="generateReport()">
                <option value="ALL" id="opt-all">All Locations</option>
                <option value="BNN">BNN</option>
                <option value="UNN1">UNN1</option>
                <option value="UNN2">UNN2</option>
              </select>
            </div>
          </div>

          <div class="report-table-container">
            <table class="report-table">
              <thead>
                <tr>
                  <th id="th-location">Location</th>
                  <th id="th-date">Date</th>
                  <th id="th-timeslot">Time Slot</th>
                  <th id="th-coordinates">Coordinates</th>
                  <th id="th-status">Status</th>
                </tr>
              </thead>
              <tbody id="report-table-body">
                <!-- Log rows rendered dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Page View 4: Standalone Settings Page -->
    <div id="settings-module-page" class="page-view module-page">
      <div style="margin-bottom: 1.5rem;" class="no-print">
        <button class="btn" onclick="showHomePage()" style="background-color: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.5rem 1rem;" id="back-home-settings">
          ← Back to To-Do List
        </button>
      </div>

      <div class="module-page-card">
        <h1 style="color: var(--accent-color); font-size: 2rem; margin-bottom: 1rem;" id="settings-title">Settings</h1>

        <div class="settings-tabs" role="tablist">
          <button type="button" class="tab-btn active" role="tab" aria-selected="true" aria-controls="tab-task-timing" id="tab-btn-task-timing" data-tab="task-timing" onclick="switchSettingsTab('task-timing')">Task Timing</button>
          <button type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-schedule" id="tab-btn-schedule" data-tab="schedule" onclick="switchSettingsTab('schedule')">Schedule</button>
        </div>

        <!-- Tab: Task Timing -->
        <form id="tab-task-timing" class="tab-content active" role="tabpanel" aria-labelledby="tab-btn-task-timing" onsubmit="saveTaskSettings(event)">
          <div class="slider-group">
            <div class="slider-header">
              <label for="setting-opens-before" id="label-opens-before">Appears early</label>
              <span class="slider-value" id="value-opens-before"></span>
            </div>
            <div class="slider-wrap">
              <output class="slider-bubble" id="bubble-opens-before" for="setting-opens-before"></output>
              <input type="range" id="setting-opens-before" class="slider" min="0" max="120" step="5" oninput="onTaskSettingsInput('opens')">
            </div>
          </div>

          <div class="slider-group">
            <div class="slider-header">
              <label for="setting-window" id="label-window">Time limit</label>
              <span class="slider-value" id="value-window"></span>
            </div>
            <div class="slider-wrap">
              <output class="slider-bubble" id="bubble-window" for="setting-window"></output>
              <input type="range" id="setting-window" class="slider" min="5" max="240" step="5" oninput="onTaskSettingsInput('window')">
            </div>
          </div>

          <!-- Example 6pm task window -->
          <div class="timing-preview" aria-live="polite">
            <div class="timing-scheduled-row">
              <span class="timing-scheduled" id="preview-scheduled">6pm</span>
            </div>
            <div class="timing-bar">
              <div class="timing-marker" id="timing-marker"></div>
            </div>
            <div class="timing-labels">
              <span id="preview-opens"></span>
              <span id="preview-closes"></span>
            </div>
          </div>

          <div class="sheet-actions">
            <button type="button" class="btn btn-secondary" onclick="resetTaskSettings()" id="settings-reset">Reset</button>
            <button type="submit" class="btn" id="settings-save">Save</button>
          </div>
          <div id="settings-message" class="settings-message" aria-live="polite"></div>
        </form>

        <!-- Tab: Schedule (photo times) -->
        <form id="tab-schedule" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-schedule" onsubmit="saveTaskSlots(event)">
          <ul class="slot-list" id="slot-list">
            <!-- Time rows rendered dynamically -->
          </ul>
          <button type="button" class="btn btn-secondary" onclick="addSlotRow()" id="slot-add">+ Add Time</button>

          <div class="sheet-actions">
            <button type="button" class="btn btn-secondary" onclick="resetTaskSlots()" id="schedule-reset">Reset</button>
            <button type="submit" class="btn" id="schedule-save">Save</button>
          </div>
          <div id="schedule-message" class="settings-message" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Mata Malam. <span id="footer-rights">All rights reserved.</span></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
